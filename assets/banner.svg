<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#1e1b4b;#0f2027" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#1d4e89;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <circle cx="1050" cy="50" r="110" fill="#38bdf8" opacity="0.10">
    <animate attributeName="cx" values="1050;980;1050" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;100;50" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="100;135;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="200" r="95" fill="#8b5cf6" opacity="0.10">
    <animate attributeName="cx" values="140;210;140" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;150;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="85;120;85" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="50" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;35;50" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="90" r="2" fill="#38bdf8">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;70;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="35" r="1.8" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="45" r="2.2" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;28;45" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="95" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="150" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;130;150" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="110" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Saad Abdelrazek
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animate attributeName="y" from="140" to="110" dur="1.2s" fill="freeze"/>
  </text>

  <rect x="600" y="130" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="x" from="600" to="500" dur="1s" begin="1s" fill="freeze"/>
    <animate attributeName="width" from="0" to="200" dur="1s" begin="1s" fill="freeze"/>
  </rect>

  <text x="600" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1" opacity="0">Software Engineer
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.6s" fill="freeze"/>
  </text>

  <path d="M0,205 C300,180 600,230 900,205 C1050,192 1150,205 1200,200 L1200,240 L0,240 Z" fill="url(#wave)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,205 C300,180 600,230 900,205 C1050,192 1150,205 1200,200 L1200,240 L0,240 Z;
              M0,210 C300,235 600,185 900,210 C1050,225 1150,195 1200,205 L1200,240 L0,240 Z;
              M0,205 C300,180 600,230 900,205 C1050,192 1150,205 1200,200 L1200,240 L0,240 Z"/>
  </path>
</svg>
